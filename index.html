<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Menu</title>
    <style>
        /* General reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f7f7f7;
            overflow: hidden;
        }

        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('src/logo.JPG') center center no-repeat;
            background-size: cover;
            filter: blur(8px);
            opacity: 0.6;
            z-index: -1;
        }

        .menu-container {
            width: 80%;
            height: 80%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .menu-image {
            display: none;
            width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .menu-image.active {
            display: block;
        }

        .navigation {
            position: absolute;
            width: 100%;
            top: 50%;
            display: flex;
            justify-content: space-between;
            transform: translateY(-50%);
        }

        .nav-button {
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 16px;
            border-radius: 5px;
        }

        .nav-button:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body>
    <!-- Background image section -->
    <div class="background"></div>

    <!-- Menu container for individual images -->
    <div class="menu-container">
        <img id="menuImage1" class="menu-image active" src="src/Plan de travail 1.jpg" alt="Menu Page 1">
        <img id="menuImage2" class="menu-image" src="src/Plan de travail 2.png" alt="Menu Page 2">
        <img id="menuImage3" class="menu-image" src="src/Plan de travail 3.png" alt="Menu Page 3">
        <img id="menuImage4" class="menu-image" src="src/Plan de travail 4.png" alt="Menu Page 4">
        <img id="menuImage5" class="menu-image" src="src/Plan de travail 5.png" alt="Menu Page 5">
        <img id="menuImage6" class="menu-image" src="src/Plan de travail 6.png" alt="Menu Page 6">
        <img id="menuImage7" class="menu-image" src="src/Plan de travail 7.png" alt="Menu Page 7">
        <img id="menuImage8" class="menu-image" src="src/Plan de travail 8.png" alt="Menu Page 8">
        <img id="menuImage10" class="menu-image" src="src/Plan de travail 10.png" alt="Menu Page 10">
        <img id="menuImage11" class="menu-image" src="src/Plan de travail 11.png" alt="Menu Page 11">
        <img id="menuImage12" class="menu-image" src="src/Plan de travail 12.png" alt="Menu Page 12">
        <img id="menuImage13" class="menu-image" src="src/Plan de travail 13.png" alt="Menu Page 13">
        <img id="menuImage14" class="menu-image" src="src/Plan de travail 14.png" alt="Menu Page 14">
        <img id="menuImage15" class="menu-image" src="src/Plan de travail 15.png" alt="Menu Page 15">
        <img id="menuImage16" class="menu-image" src="src/Plan de travail 16.png" alt="Menu Page 16">
        <img id="menuImage17" class="menu-image" src="src/Plan de travail 17.png" alt="Menu Page 17">
        <img id="menuImage18" class="menu-image" src="src/Plan de travail 18.jpg" alt="Menu Page 18">
        <img id="menuImage19" class="menu-image" src="src/Plan de travail 19.jpg" alt="Menu Page 19">

        <div class="navigation">
            <button class="nav-button" onclick="prevImage()">&#8592; Previous</button>
            <button class="nav-button" onclick="nextImage()">Next &#8594;</button>
        </div>
    </div>

    <script>
        // Get all menu images
        const menuImages = document.querySelectorAll('.menu-image');
        let currentImageIndex = 0;

        // Function to show the next image
        function nextImage() {
            // Remove the active class from the current image
            menuImages[currentImageIndex].classList.remove('active');
            
            // Increment the index and loop back to the first image if necessary
            currentImageIndex = (currentImageIndex + 1) % menuImages.length;
            console.log(`Next image: ${currentImageIndex}`);  // Debugging output
            
            // Add the active class to the next image
            menuImages[currentImageIndex].classList.add('active');
        }

        // Function to show the previous image
        function prevImage() {
            // Remove the active class from the current image
            menuImages[currentImageIndex].classList.remove('active');
            
            // Decrement the index and loop back to the last image if necessary
            currentImageIndex = (currentImageIndex - 1 + menuImages.length) % menuImages.length;
            console.log(`Previous image: ${currentImageIndex}`);  // Debugging output
            
            // Add the active class to the previous image
            menuImages[currentImageIndex].classList.add('active');
        }
    </script>
</body>
</html>
