<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Menu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7f7f7;
        }

        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('src/logo.JPG') center center no-repeat;
            background-size: cover;
            filter: blur(8px);
            opacity: 0.6;
            z-index: -1;
        }

        .menu-container {
            width: 100%;
            padding: 20px;
            position: relative;
        }

        .menu-image {
            width: 100%;
            margin-bottom: 20px;
            object-fit: contain;
            display: block;
        }
    </style>
</head>
<body>
    <div class="background"></div>

    <div class="menu-container">
        <img class="menu-image" src="src/Plan de travail 1.jpg" alt="Menu Page 1">
        <img class="menu-image" src="src/Plan de travail 2.png" alt="Menu Page 2">
        <img class="menu-image" src="src/Plan de travail 3.png" alt="Menu Page 3">
        <img class="menu-image" src="src/Plan de travail 4.png" alt="Menu Page 4">
        <img class="menu-image" src="src/Plan de travail 5.png" alt="Menu Page 5">
        <img class="menu-image" src="src/Plan de travail 6.png" alt="Menu Page 6">
        <img class="menu-image" src="src/Plan de travail 7.png" alt="Menu Page 7">
        <img class="menu-image" src="src/Plan de travail 8.png" alt="Menu Page 8">
        <img class="menu-image" src="src/Plan de travail 10.png" alt="Menu Page 10">
        <img class="menu-image" src="src/Plan de travail 11.png" alt="Menu Page 11">
        <img class="menu-image" src="src/Plan de travail 12.png" alt="Menu Page 12">
        <img class="menu-image" src="src/Plan de travail 13.png" alt="Menu Page 13">
        <img class="menu-image" src="src/Plan de travail 14.png" alt="Menu Page 14">
        <img class="menu-image" src="src/Plan de travail 15.png" alt="Menu Page 15">
        <img class="menu-image" src="src/Plan de travail 16.png" alt="Menu Page 16">
        <img class="menu-image" src="src/Plan de travail 17.png" alt="Menu Page 17">
        <img class="menu-image" src="src/Plan de travail 18.jpg" alt="Menu Page 18">
        <img class="menu-image" src="src/Plan de travail 19.jpg" alt="Menu Page 19">
    </div>
</body>
</html>
